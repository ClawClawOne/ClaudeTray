name: ClaudeTray
options:
  bundleIdPrefix: com.theunnamedcompany
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "7"
targets:
  ClaudeTray:
    type: application
    platform: macOS
    sources:
      - path: ClaudeTray
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theunnamedcompany.ClaudeTray
        INFOPLIST_FILE: ClaudeTray/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClaudeTray/ClaudeTray.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
